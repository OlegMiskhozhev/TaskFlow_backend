[project]
name = "taskflow-backend"
version = "0.1.0"
description = ""
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.3.1,<4.0.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "pytest-env (>=1.5.0,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "fastapi-filter (>=2.0.1,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "filetype (>=1.2.0,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["flow/app", "tasks/app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/alembic/*",
    "flow/app/main.py",
    "tasks/app/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
    "@abstractmethod",
    "pass",
]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "flow/app/database/migrations",
    "htmlcov",
    "tasks/app/database/migrations",
]

[tool.ruff.lint]
select = [
    "B",     # flake8-bugbear (скрытые баги)
    "C4",    # flake8-comprehensions (оптимизация списков)
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (авто-сортировка импортов)
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade (современный синтаксис 3.12+)
    "ANN",   # flake8-annotations (контроль тайп-хинтинга)
    "ASYNC", # flake8-async (проверка асинхронных блокировок)
]
ignore = [
    "B008",  # Разрешаем вызовы Depends() в аргументах FastAPI
]

[tool.ruff.lint.isort]
# Исключаем рассинхрон локальных модулей со сторонними библиотеками
known-first-party = [
    "beat",
    "core",
    "database",
    "db_selectors",
    "models",
    "routers",
    "schemas",
    "services",
    "templates"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",   # В тестах полная аннотация типов не требуется
    "E402",  # Разрешаем sys.path-хаки в тестовом окружении
]
"flow/app/database/db.py" = [
    "UP035", # Сохраняем typing.Callable для совместимости с ParamSpec
    "UP047", # Сохраняем старый синтаксис TypeVar для mypy
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["flow/app", "tasks/app"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [
    "^flow/app/database/migrations/",
    "^tasks/app/database/migrations/",
    "^tests/",
]

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "mypy (>=2.0.0,<3.0.0)"
]

[tool.uv]
package = false
