[pytest]
addopts =
    --cov=tasks/app
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    -v
filterwarnings =
    ignore::DeprecationWarning:passlib.handlers.argon2
    ignore::DeprecationWarning:passlib.utils
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
env =
    TASKS_DB_USER=admin
    TASKS_DB_PASSWORD=admin123
    TASKS_DB=tasks_db_test
    TASKS_DB_PORT=5432
    TASKS_DB_HOST=tasks_db_test
    TASKS_DB_PORT_HOST=5436

    EMAIL_HOST=smtp.example.com
    EMAIL_PORT=587
    EMAIL_USERNAME=user@example.com
    EMAIL_PASSWORD=change_me

    REDIS_HOST=redis
    REDIS_PORT=6379
    REDIS_DB=0

    HOST_URL=http://localhost:5173
    HOST_PORT=5173

    JWT_ALGORITHM=HS256
    SECRET_KEY=test_secret_key_for_tests_only_32chars_min

    MINIO_URL=minio:9000
    MINIO_ROOT_USER=admin
    MINIO_ROOT_PASSWORD=admin123
    TESTING=True
