[pytest]
addopts =
    --cov=flow/app
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    -v
filterwarnings =
    ignore::DeprecationWarning:passlib.handlers.argon2
    ignore::DeprecationWarning:passlib.utils
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
env =
    FLOW_DB_USER=admin
    FLOW_DB_PASSWORD=admin123
    FLOW_DB=flow_db_test
    FLOW_DB_PORT=5432
    FLOW_DB_HOST=flow_db_test
    FLOW_DB_PORT_HOST=5435

    EMAIL_HOST=smtp.example.com
    EMAIL_PORT=587
    EMAIL_USERNAME=user@example.com
    EMAIL_PASSWORD=change_me

    REDIS_HOST=redis
    REDIS_PORT=6379
    REDIS_DB=0

    HOST_URL=http://localhost:5173
    TASKS_USER_ID_URL=http://tasks_backend:8000/user/id

    JWT_ALGORITHM=HS256
    SECRET_KEY=test_secret_key_for_tests_only_32chars_min

    MINIO_URL=minio:9000
    MINIO_ROOT_USER=admin
    MINIO_ROOT_PASSWORD=admin123
    TESTING=True
